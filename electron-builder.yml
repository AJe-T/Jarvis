appId: com.sir.jarvis
productName: Jarvis
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
  - resources/**
  # Porcupine/PvRecorder and nut.js native libs open their model and .dll files by real path.
  - node_modules/@picovoice/**
  - node_modules/@nut-tree-fork/**
extraResources:
  - from: resources/
    to: resources/
    filter: ['**/*', '!fonts/**']
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# Security.md §7: lock the binary down. file:// privileges stay on because the renderer loads from file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: [nsis]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Jarvis-Setup-${version}.${ext}
# All native deps ship N-API prebuilds, so no compiler (VS Build Tools) is needed.
npmRebuild: false
