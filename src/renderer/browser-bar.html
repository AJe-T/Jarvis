<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"
    />
    <title>Jarvis Browser</title>
  </head>
  <body>
    <form id="bar" autocomplete="off">
      <button type="button" id="back" title="Back (Alt+←)" aria-label="Back" disabled>
        &#x2190;
      </button>
      <button type="button" id="forward" title="Forward (Alt+→)" aria-label="Forward" disabled>
        &#x2192;
      </button>
      <button type="button" id="reload" title="Reload (F5)" aria-label="Reload">&#x21bb;</button>
      <button type="button" id="home" title="Home" aria-label="Home">&#x2302;</button>
      <span id="lock" aria-hidden="true"></span>
      <input
        id="address"
        aria-label="Address or search"
        placeholder="Search or type a web address (Ctrl+L)"
        spellcheck="false"
      />
      <span
        id="badge"
        title="Pages here are kept apart from Jarvis: their own cookies, no access to Jarvis"
        >JARVIS</span
      >
    </form>
    <script type="module" src="./src/apps-pages/browser-bar.ts"></script>
  </body>
</html>
